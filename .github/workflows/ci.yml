name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege.
permissions:
  contents: read

# Cancel redundant runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build & Test
    # macos-26 ships Xcode 26 / Swift 6.2. `macos-latest` still aliases to
    # macOS 15, which lacks the macOS 26 SDK this package targets — so pin 26.
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Toolchain
        run: swift --version

      - name: Format lint
        run: swift format lint --strict --recursive Sources Tests Package.swift

      - name: Build
        run: swift build

      - name: Test
        run: swift test
